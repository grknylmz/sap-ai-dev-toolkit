[package]
name = "sap-ai-webgui"
version = "0.9.9927"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[[bin]]
name = "sap-ai-webgui"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-std", "io-util", "time", "sync", "net", "process", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
toml = "0.9"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake", "connect"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

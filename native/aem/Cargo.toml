[package]
name = "sap-ai-aem"
version = "0.9.9925"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[[bin]]
name = "sap-ai-aem"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "io-std", "time", "sync"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots", "json", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2.3"
url = "2.5"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

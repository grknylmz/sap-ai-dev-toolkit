name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build-vsp:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit SHA (tags are mutable).
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'
      - name: Require package repository metadata
        run: node -e "const p=require('./package.json'); if (!p.repository?.url) throw new Error('package.json repository.url is required')"
      - run: npm run build:vsp
      - name: Publish patched VSP assets
        uses: softprops/action-gh-release@62c96d0c4e8a889135c1f3a25910db8dbe0e85f7 # v2.3.4
        with:
          files: |
            dist/*
            LICENSE
            NOTICE
            LICENSE-APACHE-2.0.txt
          fail_on_unmatched_files: true

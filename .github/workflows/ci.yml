name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test native AEM server
        run: cargo test --locked --manifest-path native/aem/Cargo.toml
      - name: Build native AEM server
        run: cargo build --locked --manifest-path native/aem/Cargo.toml
      - name: Test native WebGUI server
        run: cargo test --locked --manifest-path native/webgui/Cargo.toml
      - name: Build native WebGUI server
        run: cargo build --locked --manifest-path native/webgui/Cargo.toml
      - name: Run test suite
        run: npm test
